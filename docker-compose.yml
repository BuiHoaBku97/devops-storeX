services:
  store-x-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: store-x-service:latest
    container_name: store-x-service
    ports:
      - "8888:8888"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    restart: unless-stopped
    depends_on:
      store-x-db:
        condition: service_healthy
      store-x-redis:
        condition: service_healthy
    networks:
      - storex-net

  store-x-db:
    image: postgres:17-alpine
    container_name: store-x-db-container
    restart: unless-stopped
    environment:
      - POSTGRES_DB=store-x-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - store-x-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store-x-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storex-net

  store-x-redis:
    image: redis:7-alpine
    container_name: store-x-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - store-x-redis-data:/data

    # Healthcheck for Redis
    # Sử dụng lệnh terminal "redis-cli ping" để kiểm tra tình trạng của Redis.
    # Nếu Redis trả về "PONG", nó được coi là khỏe mạnh.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storex-net

volumes:
  store-x-db-data:
  store-x-redis-data:

networks:
  storex-net:
    name: storex-net
    driver: bridge
